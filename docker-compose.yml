services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cmanager-php:latest
    container_name: cmanager-app
    ports:
      - "9012:9012"
    environment:
      APP_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    extra_hosts:
      - "host.docker.internal:172.27.0.1"
    volumes:
      - .:/app
      - /app/vendor
      - /app/bootstrap/cache
      - /app/storage
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - vendor/
            - .git/
            - docker-compose.yml
            - Dockerfile
            - README.md
            - bootstrap/cache/
            - storage/

  postgres:
    image: postgres:16-alpine
    container_name: cmanager-postgres
    ports:
      - "5443:5432"
    environment:
      POSTGRES_DB: tvshow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tvshow"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
